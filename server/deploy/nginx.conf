# Сертификат добавит certbot: sudo certbot --nginx -d rigsalbums.ru -d www.rigsalbums.ru

server {
    listen 80;
    listen [::]:80;
    server_name rigsalbums.ru www.rigsalbums.ru;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Стили и скрипты браузер каждый раз сверяет, чтобы правки доходили сразу
    location ~* ^/assets/.+\.(css|js|webmanifest)$ {
        root /srv/rigsalbums;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # Картинки и шрифты nginx отдаёт сам, без Node, и кэширует на неделю
    location /assets/ {
        root /srv/rigsalbums;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Загрузка фото и видео из админки: большие файлы и долгая отправка с телефона
    location /admin/api/media {
        client_max_body_size 420m;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Перезаписываем, а не дописываем: подделать свой IP снаружи нельзя
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
